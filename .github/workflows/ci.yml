name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install --frozen-lockfile
      
    - name: Check formatting
      run: bun run format:check || echo "Format check failed, consider running bun run format"
      
    - name: Run linter
      run: bun run lint
      
    - name: Run tests
      run: bun test
      env:
        NODE_ENV: test
        JWT_SECRET: test_secret
        JWT_REFRESH_SECRET: test_refresh_secret
        
    - name: Build application
      run: bun run build
